---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
    <p class="meta">
      {% if page.tools %}{% for t in page.tools %}<span class="tag">{{ t }}</span>{% endfor %}{% endif %}
      {% if page.repo %} · <a href="{{ page.repo }}">Source code</a>{% endif %}
    </p>
  </header>
  {{ content }}
</article>
<p><a href="{{ '/projects/' | relative_url }}">&larr; All projects</a></p>
