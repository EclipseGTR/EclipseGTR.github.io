---
layout: default
---
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
      {% if page.tags.size > 0 %} · {% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}{% endif %}
    </p>
  </header>
  {{ content }}
</article>
<p><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
